# Release: runs when a tag vX.Y.Z is pushed. Builds the .xpi with build.sh,
# checks it against manifest.json and updates.json, attests its build
# provenance, and creates the GitHub release with the .xpi attached and the
# CHANGELOG.md section of the version as notes.
#
# Verify a downloaded .xpi with:
#   gh attestation verify zotero-pdf-preview-pane-X.Y.Z.xpi --repo alberti42/zotero-pdf-preview-pane

name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # Sigstore certificate for the attestation
      attestations: write      # store the attestation
      artifact-metadata: write # artifact storage record of the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against manifest.json
        run: |
          version=$(python3 -I -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in manifest.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "XPI=build/zotero-pdf-preview-pane-$version.xpi" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      # updates.json is written before the tag, from a local build; the build
      # is reproducible, so this build must have the same SHA-256.
      - name: Check the .xpi against updates.json
        run: |
          python3 -I - <<'EOF'
          import hashlib, json, os, sys
          version, xpi = os.environ['VERSION'], os.environ['XPI']
          digest = 'sha256:' + hashlib.sha256(open(xpi, 'rb').read()).hexdigest()
          manifest = json.load(open('manifest.json'))
          addon_id = manifest['applications']['zotero']['id']
          updates = json.load(open('updates.json'))['addons'][addon_id]['updates']
          entry = next((u for u in updates if u['version'] == version), None)
          if entry is None:
              sys.exit(f'::error::updates.json has no entry for {version}')
          expected_link = (f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/'
                           f'v{version}/{os.path.basename(xpi)}')
          if entry['update_link'] != expected_link:
              sys.exit(f'::error::update_link in updates.json is {entry["update_link"]}, expected {expected_link}')
          if entry['update_hash'] != digest:
              sys.exit(f'::error::update_hash in updates.json is {entry["update_hash"]}, the build gives {digest}')
          print(f'{xpi}: {digest}')
          EOF

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.XPI }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'EOF' > notes.md
          import os, re, sys
          version = os.environ['VERSION']
          text = open('CHANGELOG.md').read()
          m = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: )', text, re.S | re.M)
          if not m:
              sys.exit(f'::error::CHANGELOG.md has no section for {version}')
          print(m.group(1).strip())
          EOF
          gh release create "$GITHUB_REF_NAME" "$XPI" --title "$VERSION" --notes-file notes.md --verify-tag
